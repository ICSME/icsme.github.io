---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}<h5 class="post-description">{{ page.description }}</h5>{% endif %}
  </header>

  <article class="post-content">
    {{ content }}
  </article>

</div>
